<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F9E076;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#000000" rx="10"/>

  <!-- Icono del Trigo -->
  <g transform="translate(50, 40) scale(0.8)">
    <!-- Tallo -->
    <path d="M 40,140 Q 45,80 40,20" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Granos (Izquierda) -->
    <path d="M 40,110 Q 15,100 38,85 Z" fill="url(#goldGrad)"/>
    <path d="M 40,85 Q 15,75 38,60 Z" fill="url(#goldGrad)"/>
    <path d="M 40,60 Q 15,50 38,35 Z" fill="url(#goldGrad)"/>
    <path d="M 40,35 Q 25,25 40,10 Z" fill="url(#goldGrad)"/>

    <!-- Granos (Derecha) -->
    <path d="M 42,120 Q 67,110 44,95 Z" fill="url(#goldGrad)"/>
    <path d="M 42,95 Q 67,85 44,70 Z" fill="url(#goldGrad)"/>
    <path d="M 42,70 Q 67,60 44,45 Z" fill="url(#goldGrad)"/>
    <path d="M 42,45 Q 57,35 42,20 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Texto NEXORA -->
  <text x="160" y="105" font-family="Arial, sans-serif" font-weight="bold" font-size="65" fill="url(#goldGrad)" style="letter-spacing: 2px;">NEXORA</text>

  <!-- Subtexto -->
  <text x="162" y="135" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" style="letter-spacing: 5px; opacity: 0.8;">GESTIÓN DE PANADERÍAS</text>
</svg>
